[project]
name = "crispy-copilot-gateway"
version = "0.1.1"
description = "Local Copilot API gateway - universal Anthropic/OpenAI endpoints for any harness, with a management UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "nicegui>=2.14",
    "typer>=0.15",
]

[project.scripts]
crispy-copilot = "crispy_copilot_gateway.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crispy_copilot_gateway"]
